<!doctype html><meta charset="utf-8"><title>P006 Robot Articulation Showcase</title><style>body{margin:0;background:#101820;color:#eef;font:14px system-ui}header{padding:10px;background:#183247;display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button{padding:7px;background:#233d50;color:#fff;border:1px solid #789}#status{margin-left:auto;font-family:monospace}main{height:calc(100vh - 62px)}canvas{width:100%;height:100%;display:block}</style><header><b>🤖 P006 Robot Articulation Showcase</b><select id="robot"></select><button id="play">▶ PLAY</button><button id="pause">⏸ PAUSE</button><button id="resume">▶ RESUME</button><button id="stop">■ STOP/HOME</button><span id="status">S1 HTML loaded</span></header><main><canvas id="v"></canvas></main><script type="module">
const $=x=>document.getElementById(x),base='/projects/P006/assets',status=$('status');let T,GLTFLoader,R,S,C,G,L,data=[],obj,joints=[],playing=false,pose=0,last=performance.now();const stage=(s,d='')=>{status.textContent=s+(d?' · '+d:'');console.info('[P006 ROBOT]',s,d)},fail=(s,e)=>{status.textContent=`ERROR ${s}: ${e?.message||e}`;console.error(e)};
async function init(){try{stage('S2 Three.js importing');T=await import('/projects/P006/assets/3d-derived/vendor/three.module.js?v=20260913');stage('S2 Three.js imported');({GLTFLoader}=await import('/projects/P006/assets/3d-derived/vendor/GLTFLoader.js?v=20260913'));stage('S3 GLTFLoader imported');R=new T.WebGLRenderer({canvas:$('v'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));S=new T.Scene();S.background=new T.Color(0x172532);C=new T.PerspectiveCamera(45,1,.1,5000);S.add(new T.HemisphereLight(0xffffff,0x334455,2.2));const D=new T.DirectionalLight(0xffffff,3);D.position.set(5,10,6);S.add(D);G=new T.Group();S.add(G);L=new GLTFLoader();const u=base+'/functional-simulation/robot-articulated-10/manifest.json';stage('S4 Robot manifest fetching');data=[{assetId:'A259',assetName:'로봇 툴 자동 검사 스테이션',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/A259.glb',tool:'tool'},{assetId:'A260',assetName:'로봇 교정 스테이션',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/A260.glb',tool:'inspectionHead'},{assetId:'E002',assetName:'주탕 로봇',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/E002.glb',tool:'weldingTool'},{assetId:'E003',assetName:'세척/스프레이 로봇',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/E003.glb',tool:'suctionTool'},{assetId:'E004',assetName:'취출 로봇',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/E004.glb',tool:'transferTool'},{assetId:'E125',assetName:'자율이동 운반 로봇 AMR',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/E125.glb',tool:'gripperTool'},{assetId:'N141',assetName:'스카라 로봇',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/N141.glb',tool:'inspectionHead'},{assetId:'N142',assetName:'델타 로봇',derivedGLB:'/projects/P006/assets/functional-simulation/robot-articulated-10/N142.glb',tool:'weldingTool'},{assetId:'N143',assetName:'직교 좌표 로봇',derivedGLB:'/projects/P00 function resize(){const r=$('v').getBoundingClientRect();if(!R)return;R.setSize(r.width,r.height,false);C.aspect=r.width/r.height;C.updateProjectionMatrix()}addEventListener('resize',resize);function home(){joints.forEach(j=>j.rotation.set(0,0,0));pose=0}async function load(){try{const m=data.find(x=>x.assetId===$('robot').value);if(!m)throw Error('selected robot missing');G.clear();stage('S7 A259 Derived GLB fetching');const u0=m.derivedGLB.startsWith('/')?m.derivedGLB:base+m.derivedGLB;const u=u0.replace('/robot-articulated-9/','/robot-articulated-10/').replace('/robot-articulated-a259/','/robot-articulated-10/');const g=await L.loadAsync(u);stage('S8 GLTFLoader load/parse');obj=g.scene;G.add(obj);stage('S9 gltf.scene attached');joints=['shoulder','elbow','wrist',m.tool].map(n=>obj.getObjectByName(n)).filter(Boolean);if(joints.length<4)throw Error(`joints ${joints.length}/4`);stage('S10 joints resolved','4/4');const b=new T.Box3().setFromObject(obj),c=b.getCenter(new T.Vector3()),s=b.getSize(new T.Vector3()),d=Math.max(s.x,s.y,s.z,1)*2.4;C.position.set(c.x+d,c.y+d*.7,c.z+d);C.lookAt(c);home();stage('S11 controller created')}catch(e){fail('LOAD',e)}}function play(){playing=true;stage('PLAYING · MULTI-JOINT')}function pause(){playing=false;stage('PAUSED')}function resume(){playing=true;stage('PLAYING · MULTI-JOINT')}function stop(){playing=false;home();stage('STOP_RESET · HOME')}$('play').onclick=play;$('pause').onclick=pause;$('resume').onclick=resume;$('stop').onclick=stop;function frame(t){requestAnimationFrame(frame);const dt=Math.min(.1,(t-last)/1000);last=t;if(playing&&joints.length>=4){pose=(pose+dt*.7)%1;const a=Math.sin(pose*Math.PI*2);joints[0].rotation.z=a*.55;joints[1].rotation.z=-a*.8;joints[2].rotation.y=a*.45;joints[3].rotation.x=a*.3}R.render(S,C)}init();
