function legacyGatePoint(point,x,z){return !!point&&Math.abs((Number(point.x)||0)-x)<.01&&Math.abs((Number(point.z)||0)-z)<.01;}
function ensureGateDefaults(plan=p){let changed=false;for(const s of plan.sites||[]){const w=Number(s.width)||120,d=Number(s.depth)||90,slot=Math.min(10,Math.max(0,w/2-6));if(legacyGatePoint(s.entrance,0,-d/2)&&legacyGatePoint(s.exit,0,d/2)){s.entrance={x:-slot,z:d/2};s.exit={x:slot,z:d/2};changed=true;}else{if(!s.entrance){s.entrance={x:-slot,z:d/2};changed=true;}if(!s.exit){s.exit={x:slot,z:d/2};changed=true;}}}for(const f of plan.factories||[]){const w=Number(f.width)||60,d=Number(f.depth)||30,slot=Math.min(8,Math.max(0,w/2-6));if(legacyGatePoint(f.inlet,0,-d/2)&&legacyGatePoint(f.outlet,0,d/2)){f.inlet={x:-slot,z:d/2};f.outlet={x:slot,z:d/2};changed=true;}else{if(!f.inlet){f.inlet={x:-slot,z:d/2};changed=true;}if(!f.outlet){f.outlet={x:slot,z:d/2};changed=true;}}}for(const t of plan.transports||[])if(!Array.isArray(t.waypoints))t.waypoints=[];if(plan===p&&changed&&!dirty)mark();}

function factoryHalfBox(f){const a=(Number(f.yaw)||0)*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return{x:(c*Number(f.width)+s*Number(f.depth))/2,z:(s*Number(f.width)+c*Number(f.depth))/2};}
function findFactorySpace(f,placed){const site=p.sites.find(s=>s.id===f.siteId);if(!site)return null;const half=factoryHalfBox(f),minX=-site.width/2+5+half.x,maxX=site.width/2-5-half.x,minZ=-site.depth/2+5+half.z,maxZ=site.depth/2-18-half.z;if(minX>maxX||minZ>maxZ)return null;const others=placed.filter(o=>o.siteId===f.siteId&&o.id!==f.id).map(o=>({f:o,h:factoryHalfBox(o)})),step=Math.max(1,Number(p.snap)||1);for(let z=Math.ceil(minZ/step)*step;z<=maxZ+.001;z+=step)for(let x=Math.ceil(minX/step)*step;x<=maxX+.001;x+=step)if(others.every(o=>Math.abs(x-o.f.x)>=half.x+o.h.x+6||Math.abs(z-o.f.z)>=half.z+o.h.z+6))return{x,z};return null;}

const REGISTRY_API='/projects/P006/registry-api';
function serverAssetPath(code,id=''){return REGISTRY_API+'/asset-evidence/'+encodeURIComponent(code)+(id?'/'+encodeURIComponent(id):'');}
function setServerPlanStatus(text,state=''){const el=$('server-plan-state');if(el){el.textContent=text;el.dataset.state=state;}}
function renderServerPlanBar(){const select=$('server-plan-select');if(!select)return;const current=select.value;select.innerHTML=serverPlans.length?serverPlans.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} · r${esc(r.revision)} · 서버 v${esc(r.version)}</option>`).join(''):'<option value="">저장된 서버 계획이 없습니다</option>';if(serverPlans.some(r=>r.id===current))select.value=current;else if(serverPlans.some(r=>r.id===p.id))select.value=p.id;for(const a of ['refresh-server-plans','load-server-plan','save-server-plan']){const b=document.querySelector(`[data-action="${a}"]`);if(b)b.disabled=serverPlanBusy;}}
async function refreshServerPlans(){serverPlanBusy=true;renderServerPlanBar();setServerPlanStatus('계정 서버 계획 목록을 확인 중…');try{const response=await fetch(REGISTRY_API+'/production-plans',{credentials:'same-origin',headers:{Accept:'application/json'}}),result=await response.json().catch(()=>({}));if(!response.ok)throw Error(response.status===401?'로그인이 필요합니다. WOOSU에 로그인한 뒤 다시 확인하세요.':result.error||('서버 응답 '+response.status));serverPlans=Array.isArray(result.items)?result.items:[];renderServerPlanBar();setServerPlanStatus(`로그인 계정 서버 · ${serverPlans.length}개 계획 · 최신 목록`,'ok');}catch(err){setServerPlanStatus(err.message,'error');}finally{serverPlanBusy=false;renderServerPlanBar();}}
async function loadServerPlan(){const id=$('server-plan-select')?.value;if(!id)return msg('서버 계획 목록에서 복원할 계획을 선택하세요.');if(dirty&&!confirm('브라우저의 저장하지 않은 변경은 유지되지 않습니다. 서버 계획을 열까요?'))return;serverPlanBusy=true;renderServerPlanBar();setServerPlanStatus('서버 계획과 버전을 불러오는 중…');try{const response=await fetch(REGISTRY_API+'/production-plans/'+encodeURIComponent(id),{credentials:'same-origin',headers:{Accept:'application/json'}}),result=await response.json().catch(()=>({}));if(!response.ok)throw Error(response.status===401?'로그인이 필요합니다.':result.error||('서버 응답 '+response.status));if(!result.plan||result.plan.id!==id)throw Error('서버 계획 ID 검증에 실패했습니다.');const loaded=clone(result.plan);loaded._serverVersion=result.version;plans=plans.filter(r=>r.id!==id).concat(loaded);p=clone(loaded);selected=p.equipment[0]?.id;dirty=false;history=[];future=[];time=0;localStorage.setItem(KEY,JSON.stringify(plans));render();setServerPlanStatus(`${loaded.name} · 서버 v${result.version} 복원 완료`,'ok');msg('서버 계획을 열었습니다. 제품·부지·공정·운송과 3D 설정을 복원했습니다.');}catch(err){setServerPlanStatus(err.message,'error');msg('서버 복원 실패 · '+err.message);}finally{serverPlanBusy=false;renderServerPlanBar();}}
async function saveServerPlan(){const errors=validate();if(errors.length){open('서버 저장 전 확인',errors.map(s=>`<p>• ${esc(s)}</p>`).join(''));return;}if(serverPlanBusy)return;serverPlanBusy=true;renderServerPlanBar();setServerPlanStatus('계정 서버에 계획 저장 중…');try{const copy=clone(p),baseVersion=Number(copy._serverVersion||0);delete copy._serverVersion;copy.revision=(Number(copy.revision)||0)+1;const response=await fetch(REGISTRY_API+'/production-plans/'+encodeURIComponent(copy.id),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-P006-Requested-With':'equipment-registry'},body:JSON.stringify({plan:copy,baseVersion})}),result=await response.json().catch(()=>({}));if(response.status===409)throw Error('버전 충돌: 다른 기기/탭의 서버 변경을 보호했습니다. 서버 목록 새로고침 후 최신 계획을 열어 변경사항을 비교하세요.');if(!response.ok)throw Error(response.status===401?'로그인이 필요합니다. WOOSU 로그인 후 저장하세요.':result.error||('서버 응답 '+response.status));copy._serverVersion=result.version;const next=plans.filter(r=>r.id!==copy.id).concat(copy);localStorage.setItem(KEY,JSON.stringify(next));plans=next;p=clone(copy);dirty=false;serverPlans=serverPlans.filter(r=>r.id!==copy.id).concat({id:copy.id,name:copy.name,code:copy.code,revision:copy.revision,version:result.version,updatedAt:result.updatedAt});render();setServerPlanStatus(`저장 완료 · 서버 v${result.version} · ${new Date(result.updatedAt).toLocaleString('ko-KR')}`,'ok');msg(`로그인 계정 서버에 저장했습니다 · Revision ${copy.revision} · v${result.version}`);}catch(err){setServerPlanStatus(err.message,'error');msg('서버 저장 실패 · '+err.message);}finally{serverPlanBusy=false;renderServerPlanBar();}}
function assetFromEvidence(r){const m=r.metadata||{},format=String(m.format||'URL').toUpperCase();return{id:r.id,serverId:r.id,name:r.name,provider:m.provider||'사용자 등록',packId:m.packId||'',format,fileName:m.fileName||'',fileId:'',size:r.bytes||0,url:r.source_uri||'',license:m.license||'사용권 확인 필요',manufacturer:m.manufacturer||'미확인',model:m.model||'미확인',targetId:'',targetName:m.targetName||'',targetAssetCode:m.targetAssetCode||r.assetId,status:r.bytes?(format==='GLB'?'계정 서버 저장 · GLB 미리보기 가능':'계정 서버 저장 · USD 웹 변환 대기'):'출처 URL 저장 · 파일 미등록',reviewStatus:r.review_status||'UNREVIEWED',sha256:r.sha256||'',mime:r.mime||'application/octet-stream'};}
async function loadSharedAssets(code=eq()?.asset,force=false){code=String(code||'').trim();const request=++sharedAssetRequest;if(!code){sharedAssetRecords=[];sharedAssetStatus='선택한 설비에 자산 코드가 없어 서버 라이브러리를 조회할 수 없습니다.';return [];}if(!force&&sharedAssetLoadedCodes.has(code)){if(sharedAssetCode!==code){sharedAssetCode=code;sharedAssetRecords=sharedAssetsByCode.get(code)||[];}return sharedAssetRecords;}sharedAssetCode=code;sharedAssetRecords=sharedAssetsByCode.get(code)||[];sharedAssetStatus=code+' 서버 자료 조회 중…';try{const response=await fetch(serverAssetPath(code),{credentials:'same-origin',headers:{Accept:'application/json'}});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(response.status===401?'로그인이 필요합니다. 로그인 후 다시 불러오세요.':result.error||('서버 응답 '+response.status));if(request!==sharedAssetRequest)return sharedAssetRecords;sharedAssetRecords=(result.evidence||[]).filter(r=>r.kind==='MODEL_3D'||r.kind==='PACK_REFERENCE'||(r.metadata||{}).format).map(assetFromEvidence);sharedAssetsByCode.set(code,sharedAssetRecords);sharedAssetLoadedCodes.add(code);sharedAssetStatus=code+' · 계정 서버 자료 '+sharedAssetRecords.length+'개';}catch(err){if(request===sharedAssetRequest)sharedAssetStatus='서버 조회 실패 · '+err.message;}return sharedAssetRecords;}

function itemCatalogPanel(){const candidates=p.parts;return `<section class="panel" id="item-catalog-panel"><div class="panel-head"><div><h2>품목 3D 자산 · 중간품 · 완제품 · 부산물</h2><small>부품과 공정 산출물을 한 목록에서 관리합니다. 각 공정·운송은 같은 품목 ID를 참조합니다.</small></div><div class="actions">${btn('＋ 중간품 추가','add-intermediate')}${btn('＋ 완제품 추가','add-finished')}${btn('＋ 부산물 추가','add-byproduct')}</div></div><div class="item-catalog">${candidates.map(item=>{const i=p.parts.indexOf(item);const producer=p.processes.find(r=>[...(r.outputIds||[]),...(r.byproductIds||[])].includes(item.id));return `<article class="item-card"><div class="item-title">${item.thumbnail?`<img src="${esc(item.thumbnail)}" alt="${esc(item.name)} 썸네일">`:'<span class="thumb">3D</span>'}<span><b>${esc(item.name)}</b><small>${item.isBom!==false?'제품 구성품':'공정 산출품'} · ${esc(producer?.name||'생산 공정 미지정')} · ${esc(item.quantity||1)} ${esc(item.unit||'개')}</small></span></div><label class="field">품목 유형<select data-field="parts.${i}.kind">${['원자재','부품','중간품','완제품','부산물'].map(v=>`<option ${item.kind===v?'selected':''}>${v}</option>`).join('')}</select></label><div><label class="field">3D 자산 경로<input data-field="parts.${i}.model" value="${esc(item.model||'')}" placeholder="/projects/P006/assets/3d-derived/part.glb 또는 USD 경로"></label><label class="field">썸네일 URL<input data-field="parts.${i}.thumbnail" value="${esc(item.thumbnail||'')}" placeholder="선택 · 이미지 경로"></label></div><div class="item-actions"><button data-action="choose-part-asset" data-part-id="${esc(item.id)}">자산 후보</button>${item.isBom===false?`<button class="danger" data-remove="parts" data-id="${esc(item.id)}">삭제</button>`:''}</div></article>`;}).join('')||'<div class="empty">품목이 없습니다.</div>'}</div><div class="notice">GLB·glTF 웹 모델 경로는 실행 화면에 불러옵니다. USD·USDA 원본은 현재 웹 렌더러에서 직접 재생되지 않으며 변환된 GLB 경로가 필요합니다.</div></section>`;}

const baseTable=table;
table=function(group,cols){if(group!=='parts')return baseTable(group,cols);const idx=p.parts.map((r,i)=>({r,i})).filter(x=>x.r.isBom!==false);return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>유형</th><th>작업</th></tr></thead><tbody>${idx.map(({r,i})=>`<tr>${cols.map(([k,label,type,choices])=>`<td>${type==='select'?`<select aria-label="${label} ${i+1}" data-field="parts.${i}.${k}"><option value="">미배정</option>${(Array.isArray(choices)?choices:(choices==='equipment'?p.equipment:p[choices]||[])).map(v=>typeof v==='string'?`<option ${v===r[k]?'selected':''}>${esc(v)}</option>`:`<option value="${esc(v.id)}" ${v.id===r[k]?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`:`<input aria-label="${label} ${i+1}" data-field="parts.${i}.${k}" type="${type||'text'}" value="${esc(r[k]||'')}" ${type==='number'?'step="any"':''}>`}</td>`).join('')}<td><select aria-label="품목 유형 ${i+1}" data-field="parts.${i}.kind">${['원자재','부품','중간품','완제품','부산물'].map(v=>`<option ${r.kind===v?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="danger" data-remove="parts" data-id="${esc(r.id)}">삭제</button></td></tr>`).join('')}</tbody></table></div>`;};
const baseTransportForm=transportForm;
transportForm=function(r,i){let html=baseTransportForm(r,i),extra=`<label class="field">운반 품목<select data-field="transports.${i}.itemId"><option value="">품목 선택</option>${p.parts.map(x=>`<option value="${esc(x.id)}" ${x.id===r.itemId?'selected':''}>${esc(x.name)} · ${esc(x.kind||'부품')}</option>`).join('')}</select></label><label class="field">운반 수량<input type="number" min="0" step="any" data-field="transports.${i}.quantity" value="${esc(r.quantity||1)}"></label><label class="field">도착 후 공정<select data-field="transports.${i}.toProcessId"><option value="">자동/미지정</option>${p.processes.map(x=>`<option value="${esc(x.id)}" ${x.id===r.toProcessId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field">운반 차량 3D 자산<select data-field="transports.${i}.vehicleAssetId"><option value="">시연 차량 형상 사용</option>${p.equipment.filter(e=>e.glb).map(e=>`<option value="${esc(e.id)}" ${e.id===r.vehicleAssetId?'selected':''}>${esc(e.name)} · ${esc(e.asset)}</option>`).join('')}</select></label><div class="field wide site-pair"><span>출발 부지 · ${esc(p.sites.find(s=>s.id===(r.fromSiteId||p.factories.find(f=>f.id===r.from)?.siteId))?.name||'미지정')}</span><span>도착 부지 · ${esc(p.sites.find(s=>s.id===(r.toSiteId||p.factories.find(f=>f.id===r.to)?.siteId))?.name||'미지정')}</span></div>`;return html.replace('</div><div class="filters">',extra+'</div><div class="filters">');};

function injectFlowUi(){if(tab==='product'){$('content').querySelector('#item-catalog-panel')?.remove();const bom=[...$('content').querySelectorAll('.panel')].find(x=>x.querySelector('h2')?.textContent.includes('부품 구성'));if(bom)bom.insertAdjacentHTML('afterend',itemCatalogPanel());const summary=`<div class="notice"><b>생산 품목</b> · BOM ${p.parts.filter(x=>x.isBom!==false).length}개 · 공정 산출품 ${p.parts.filter(x=>x.isBom===false).length}개 · 3D 자산 연결 ${p.parts.filter(x=>x.model).length}개 · 공정 흐름은 공정·운송 탭에서 연결합니다.</div>`;const productPanel=[...$('content').querySelectorAll('.panel')].find(x=>x.querySelector('h2')?.textContent.includes('제품 기본 정보'));productPanel?.insertAdjacentHTML('beforeend',summary);}if(tab==='process'){const root=$('content').querySelector('.panel');if(root&&!$('process-flow-panel'))root.insertAdjacentHTML('afterend',processFlowPanel());const transports=[...$('content').querySelectorAll('.panel')].find(x=>x.querySelector('h2')?.textContent.includes('운송 경로'));if(transports&&!transports.querySelector('.transport-flow-note'))transports.insertAdjacentHTML('afterbegin',`<div class="notice transport-flow-note">품목·수량·도착 공정을 연결하면 재생 화면에 품목과 차량 이동이 함께 표시됩니다. 부지와 공장은 현재 선택한 출발·도착 공장에 연결됩니다.</div>`);}if(tab==='layout'){const target=$('content').querySelector('.panel');if(target&&!$('place-quick')){const box=document.createElement('section');box.className='panel';box.id='place-quick';box.innerHTML=`<div class="panel-head"><div><h2>빠른 위치·방향·크기 조정</h2><small>선택한 배치 행의 숫자를 조정하고 3D 미리보기에서 확인합니다.</small></div><span class="badge">m · degree</span></div><div class="place-quick"><label class="field">배치 대상<select id="place-target">${[...p.sites,...p.factories,...p.equipment].map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label><label class="field">X 위치<input id="place-x" type="number" step="any"></label><label class="field">Z 위치<input id="place-z" type="number" step="any"></label><label class="field">방향 °<input id="place-yaw" type="number" step="any"></label><label class="field">폭 m<input id="place-width" type="number" min="1" step="any"></label><label class="field">깊이 m<input id="place-depth" type="number" min="1" step="any"></label></div><div class="actions" style="margin-top:10px"><button data-action="apply-place">배치값 적용</button><button data-action="select-place-row">표에서 선택</button><button data-action="focus-place">선택 배치 확대</button></div><div class="notice">숫자를 입력하거나 설비 배치 탭에서 설비를 드래그하세요. 배치 뒤 경계 검사를 실행합니다.</div>`;const cols=target.closest('.cols');cols.parentNode.insertBefore(box,cols);syncPlaceControls();}}if(tab==='run'){const scene=$('content').querySelector('#main-scene');if(scene&&!$('product-scene-status'))scene.insertAdjacentHTML('afterend',`<div id="product-scene-status" class="product-scene-status" aria-live="polite"></div>`);updateProductStatus();}}
function syncPlaceControls(){const s=$('place-target');if(!s)return;const id=s.value||p.equipment[0]?.id||p.sites[0]?.id,row=[...p.sites,...p.factories,...p.equipment].find(x=>x.id===id);if(!row)return;for(const k of ['x','z','yaw','width','depth'])if($('place-'+k))$('place-'+k).value=row[k]??0;}
function outputState(item){if(!item?.id)return{};const producer=p.processes.find(r=>(r.outputIds||[]).includes(item.id)||(r.byproductIds||[]).includes(item.id));return{producer,consumer:p.processes.find(r=>(r.inputIds||[]).includes(item.id))};}
const productStatusCache=new WeakMap();
function updateProductStatus(){const host=$('product-scene-status');if(!host)return;const sc=schedule(),made=p.parts.filter(item=>p.processes.some(r=>((r.outputIds||[]).includes(item.id)||(r.byproductIds||[]).includes(item.id))&&time>=sc.processes[r.id].end)),html=made.map(x=>`<span class="badge">${esc(x.kind||'품목')} · ${esc(x.name)} ${productMeshes.find(m=>m.item?.id===x.id)?.modelLoaded?'GLB 로드 완료':productMeshes.find(m=>m.item?.id===x.id)?.modelFailed?'GLB 로드 실패':x.model?'GLB 로딩 중':'시연 프록시'}</span>`).join('')||'<span class="badge">공정 산출품 대기</span>';if(productStatusCache.get(host)===html)return;productStatusCache.set(host,html);host.innerHTML=html;}
 function processOrderPanel(){const sc=schedule();return `<section class="panel" id="process-order-panel"><div class="panel-head"><div><p class="eyebrow">02 · PROCESS STEPS</p><h2>공정 단계와 담당 설비</h2><small>이름·종류·시간을 입력하고, 실제 선행 관계를 설정합니다. 카드 위아래는 표시 순서이며 실행 시각은 선행 관계에서 계산합니다.</small></div><button data-action="apply-process-sequence" class="primary">표시 순서를 직렬 연결</button></div><div class="notice">병렬·분기 공정은 선행 공정 여러 개를 선택하세요. 직렬 연결 버튼은 기존 선행 관계를 현재 카드 순서로 바꿉니다. 실행 취소로 복원할 수 있습니다.</div><div class="process-order-list">${p.processes.map((r,i)=>{const timing=sc.processes[r.id]||{start:0,end:0};return `<article class="flow-process process-order-card" id="process-step-${esc(r.id)}"><div class="process-order-title"><span class="badge">${String(i+1).padStart(2,'0')}</span><div><b>${esc(r.name)}</b><small>${esc(r.id)} · 실행 ${timing.start.toFixed(1)}–${timing.end.toFixed(1)}분</small></div><div class="actions"><button data-action="move-process" data-process-index="${i}" data-direction="-1" ${i===0?'disabled':''}>위로</button><button data-action="move-process" data-process-index="${i}" data-direction="1" ${i===p.processes.length-1?'disabled':''}>아래로</button><button data-remove="processes" data-id="${esc(r.id)}" class="danger">삭제</button></div></div><div class="formgrid"><label class="field">공정명<input data-field="processes.${i}.name" value="${esc(r.name)}"></label><label class="field">공정 종류<input data-field="processes.${i}.kind" value="${esc(r.kind||'제작')}"></label><label class="field">소요 시간(분)<input type="number" min="0" step="any" data-field="processes.${i}.duration" value="${esc(r.duration)}"></label><label class="field">담당 설비<select data-process-equipment="${i}"><option value="">설비 미배정</option>${p.equipment.map(e=>`<option value="${esc(e.id)}" ${e.id===r.equipmentId?'selected':''}>${esc(e.name)} · ${esc(p.factories.find(f=>f.id===e.factoryId)?.name||'공장 미지정')}</option>`).join('')}</select></label><label class="field">담당 셀<select data-field="processes.${i}.cellId"><option value="">공 function pfFingerprint(){return JSON.stringify({p:{sites:p.sites,factories:p.factories,equipment:p.equipment,zones:p.zones,cells:p.cells},space:planningDraft().space});}
function pfRound(n,step){step=Math.max(.1,Number(step)||1);return Math.ceil((n-.000001)/step)*step;}
function pfLocked(id,row,s){return s.mode==='실제 공간 · 크기 고정'||String(s.locked||'').split(',').map(x=>x.trim()).filter(Boolean).some(x=>x===id||x===row.name);}
function pfGateResize(row,oldW,oldD,newW,newD,keys){for(const key of keys){const pt=row[key];if(!pt)continue;const x=Number(pt.x)||0,z=Number(pt.z)||0,dx=Math.abs(Math.abs(x)-oldW/2),dz=Math.abs(Math.abs(z)-oldD/2);if(Math.min(dx,dz)>.75)continue;if(dx<=dz)pt.x=Math.sign(x||1)*newW/2;else pt.z=Math.sign(z||1)*newD/2;}}
function pfFactoryExtent(f){let maxX=0,maxZ=0,count=0,unknown=[];const wf=worldFactory(f.id),items=p.equipment.filter(e=>e.factoryId===f.id||e.cellId&&worldCell(e.cellId)?.factoryId===f.id);for(const e of items){const w=e.cellId?worldCell(e.cellId):wf;if(!(Number(e.width)>0&&Number(e.depth)>0)){unknown.push(e.name||e.id);continue;}const pos=rotate(w,Number(e.x)||0,Number(e.z)||0),a=((w.yaw||0)+(Number(e.yaw)||0)-wf.yaw)*Math.PI/180,dx=pos.x-wf.x,dz=pos.z-wf.z,lx=dx*Math.cos(-wf.yaw*Math.PI/180)+dz*Math.sin(-wf.yaw*Math.PI/180),lz=-dx*Math.sin(-wf.yaw*Math.PI/180)+dz*Math.cos(-wf.yaw*Math.PI/180),hx=(Math.abs(Math.cos(a))*e.width+Math.abs(Math.sin(a))*e.depth)/2,hz=(Math.abs(Math.sin(a))*e.width+Math.abs(Math.cos(a))*e.depth)/2;maxX=Math.max(maxX,Math.abs(lx)+hx);maxZ=Math.max(maxZ,Math.abs(lz)+hz);count++;}return{maxX,maxZ,count,unknown};}
function pfCalculate(){const d=planningDraft(),s=d.space,locked=new Set(String(s.locked||'').split(',').map(x=>x.trim()).filter(Boolean)),factoryRows=[],siteRows=[],issues=[];const selected=s.target||'',targetSite=p.sites.find(x=>x.id===selected),targetFactory=p.factories.find(x=>x.id===selected),factories=p.factories.filter(f=>!selected||targetFactory?.id===f.id||targetSite?.id===f.siteId),step=p.snap||1,work=Number(s.work)||0,aisle=Number(s.aisle)||0,boundary=Number(s.boundary)||0,front=Number(s.front)||0;
 for(const f of factories){const ex=pfFactoryExtent(f),fixed=s.mode==='실제 공간 · 크기 고정'||locked.has(f.id)||locked.has(f.name);if(fixed){factoryRows.push({type:'factory',id:f.id,name:f.name,current:[f.width,f.depth],recommended:[f.width,f.depth],status:'고정',reason:'실제 공간 또는 잠금 대상'});continue;}if(!ex.count||ex.unknown.length){factoryRows.push({type:'factory',id:f.id,name:f.name,current:[f.width,f.depth],status:'자료 부족',reason:ex.count?'치수 미확인: '+ex.unknown.join(', '):'배치 설비가 없어 추천하지 않음'});continue;}let width=pfRound(2*(ex.maxX+work+aisle/2),step),depth=pfRound(2*(ex.maxZ+work+aisle/2),step);if(s.resize==='확장만'){width=Math.max(Number(f.width)||0,width);depth=Math.max(Number(f.depth)||0,depth);}factoryRows.push({type:'factory',id:f.id,name:f.name,current:[f.width,f.depth],recommended:[width,depth],status:'계산 완료',reason:`설비 ${ex.count}개 외곽 + 작업 여유 ${work}m + 통로 여유 ${aisle}m`});}
 const proposed=new Map(factoryRows.filter(r=>r.recommended).map(r=>[r.id,r.recommended]));const sites=p.sites.filter(site=>!selected||targetSite?.id===site.id||targetFactory&&targetFactory.siteId===site.id);
 for(const site of sites){const fixed=s.mode==='실제 공간 · 크기 고정'||locked.has(site.id)||locked.has(site.name);if(fixed){siteRows.push({type:'site',id:site.id,name:site.name,current:[site.width,site.depth],recommended:[site.width,site.depth],status:'고정',reason:'실제 공간 또는 잠금 대상'});continue;}let maxX=0,maxZ=0,count=0,unknown=[];for(const f of p.factories.filter(x=>x.siteId===site.id)){const wh=proposed.get(f.id)||[f.width,f.depth];if(!(Number(wh[0])>0&&Number(wh[1])>0)){unknown.push(f.name);continue;}const a=(Number(f.yaw)||0)*Math.PI/180,hx=(Math.abs(Math.cos(a))*wh[0]+Math.abs(Math.sin(a))*wh[1])/2,hz=(Math.abs(Math.sin(a))*wh[0]+Math.abs(Math.cos(a))*wh[1])/2;maxX=Math.max(maxX,Math.abs(Number(f.x)||0)+hx);maxZ=Math.max(maxZ,Math.abs(Number(f.z)||0)+hz);count++;}if(unknown.length){siteRows.push({type:'site',id:site.id,name:site.name,current:[site.width,site.depth],status:'자료 부족',reason:'공장 크기 미확인: '+unknown.join(', ')});continue;}if(!count){siteRows.push({type:'site',id:site.id,name:site.name,current:[site.width,site.depth],status:'자료 부족',reason:'공장이 없어 계산할 수 없음'});continue;}let width=pfRound(2*(maxX+boundary),step),depth=pfRound(2*(maxZ+boundary+front),step);if(s.resize==='확장만'){width=Math.max(Number(site.width)||0,width);depth=Math.max(Number(site.depth)||0,depth);}siteRows.push({type:'site',id:site.id,name:site.name,current:[site.width,site.depth],recommended:[width,depth],status:'계산 완료',reason:`공장 ${count}개 외곽 + 경계 ${boundary}m + 남쪽 전면 ${front}m`});}
 for(const row of factoryRows.filter(x=>x.recommended)){const f=p.factories.find(x=>x.id===row.id),w=row.recommended[0],d0=row.recommended[1],siblings=p.factories.filter(x=>x.siteId===f.siteId&&x.id!==f.id);for(const other of siblings){const gap=Number(s.gap)||0,a=(Number(f.yaw)||0)*Math.PI/180,b=(Number(other.yaw)||0)*Math.PI/180,hx=(Math.abs(Math.cos(a))*w+Math.abs(Math.sin(a))*d0+Math.abs(Math.cos(b))*other.width+Math.abs(Math.sin(b))*other.depth)/2+gap/2,hz=(Math.abs(Math.sin(a))*w+Math.abs(Math.cos(a))*d0+Math.abs(Math.sin(b))*other.width+Math.abs(Math.cos(b))*other.depth)/2+gap/2;if(Math.abs(f.x-other.x)<hx&&Math.abs(f.z-other.z)<hz)issues.push(`${f.name} / ${other.name}: 간격 ${gap}m 적용 시 외곽이 겹칠 수 있음`);}}

function pfTripErrors(id){const d=planningDraft(),t=d.trips[id],errors=[];if(document.querySelector('[data-pf][aria-invalid="true"]'))errors.push('빨간 표시된 입력값을 먼저 수정하세요');if(!t?.stops?.length)errors.push('방문 공장을 추가하세요');if(!d.vehicles.some(v=>v.id===t?.vehicleId))errors.push('유효한 차량을 선택하세요');for(const [i,v]of(t?.stops||[]).entries()){const prefix=(i+1)+'번 방문: ';if(!p.factories.some(f=>f.id===v.factoryId))errors.push(prefix+'공장을 선택하세요');if(v.dockId&&!d.docks.some(x=>x.id===v.dockId&&x.factoryId===v.factoryId))errors.push(prefix+'하역 지점 소속을 확인하세요');if(v.operation!=='대기'){if(!p.parts.some(x=>x.id===v.itemId))errors.push(prefix+'품목을 선택하세요');if(!Number.isFinite(Number(v.quantity))||Number(v.quantity)<=0)errors.push(prefix+'수량은 0보다 커야 합니다');}for(const cargo of(v.cargo||[])){if(!p.parts.some(x=>x.id===cargo.itemId)||!Number.isFinite(Number(cargo.quantity))||Number(cargo.quantity)<=0)errors.push(prefix+'추가 상하차 품목·수량을 확인하세요');}for(const key of ['wait','duration'])if(!Number.isFinite(Number(v[key]))||Number(v[key])<0)errors.push(prefix+'시간은 0 이상이어야 합니다');}return errors;}
const pfBaseValidate=validate;validate=function(){const errors=pfBaseValidate(),d=planningDraft();if(document.querySelector('[data-pf][aria-invalid="true"]'))errors.push('오류 표시된 입력값을 먼저 수정하세요');for(const v of d.docks){const f=p.factories.find(x=>x.id===v.factoryId);if(!f){errors.push(v.name+': 하역 지점 공장 누락');continue;}const x=Number(v.x),z=Number(v.z);if(!Number.isFinite(x)||!Number.isFinite(z)||Math.abs(x)>f.width/2||Math.abs(z)>f.depth/2)errors.push(v.name+': 하역 좌표가 공장 범위를 벗어납니다');if(v.kind!=='차량 대기'&&Math.min(Math.abs(Math.abs(x)-f.width/2),Math.abs(Math.abs(z)-f.depth/2))>.1)errors.push(v.name+': 하역 지점을 공장 외벽에 배치하세요');}for(const id of Object.keys(d.trips)){if(!p.transports.some(t=>t.id===id)){errors.push('삭제된 운송의 방문 초안이 남아 있습니다');continue;}errors.push(...pfTripErrors(id));}return [...new Set(errors)];};
