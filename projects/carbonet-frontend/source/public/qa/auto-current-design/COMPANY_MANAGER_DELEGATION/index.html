<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#102a43}header{background:#fff;border-bottom:3px solid #1351b4;padding:20px 38px}main{padding:26px 38px}h1{margin:0 0 8px}.meta{color:#52606d}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.step{text-align:left;background:#fff;border:2px solid #c8d8ee;border-radius:15px;padding:16px;min-height:300px;color:#102a43}.step b,.step span,.step small{display:block;margin-bottom:11px}.step span{font-weight:700;color:#1351b4}.step small{line-height:1.4;color:#52606d}.active{border-color:#1351b4!important;box-shadow:0 0 0 5px #d8e8ff}footer{margin-top:20px;padding:16px;background:#102a43;color:#fff;border-radius:12px}</style><header>대한민국 정부 공식 서비스</header><main><h1>COMPANY_MANAGER_DELEGATION</h1><div class="meta">최신 DB 설계 · 3단계 · KRDS 공통 디자인 · 화면/액터/입력/출력 릴레이</div><section class="flow"><button class="step"><b>1단계 · 위임·승계 요청과 후보 검증</b><span>액터 COMPANY_ADMIN</span><span>화면 /work/company-manager-delegation?step=cmd_request</span><small>입력 </small><small>출력 </small></button><button class="step"><b>2단계 · 직무분리·권한 변경 승인</b><span>액터 AUTHORITY_ADMIN</span><span>화면 /work/company-manager-delegation?step=cmd_approve</span><small>입력 </small><small>출력 </small></button><button class="step"><b>3단계 · 미결업무 인계·통지·종결</b><span>액터 COMPANY_ADMIN</span><span>화면 /work/company-manager-delegation?step=cmd_handover</span><small>입력 </small><small>출력 </small></button></section><footer id="status">현재 설계를 순서대로 검증합니다.</footer></main><script>const s=[...document.querySelectorAll('.step')];s.forEach((x,i)=>x.onclick=()=>{s.forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelector('#status').textContent=`${i+1}/${s.length} · ${x.querySelector('b').textContent}`;});s[0].click()</script></html>
