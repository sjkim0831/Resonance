<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자동 재녹화 감사 원장</title>
<style>:root{--navy:#052b57;--blue:#246beb;--line:#d7dce5}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172b4d;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1320px;margin:auto;padding:28px}header{padding:25px;border-radius:18px;background:linear-gradient(135deg,var(--navy),#145493);color:#fff}h1{margin:5px 0}.metrics{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.metric{min-width:140px;padding:12px;border:1px solid #ffffff55;border-radius:12px;background:#ffffff18}.metric.alert{background:#b42318}.metric b,.metric span{display:block}.metric b{font-size:24px}.filters{display:grid;grid-template-columns:1fr 180px 180px 180px;gap:10px;margin:18px 0}.filters input,.filters select{height:44px;border:1px solid var(--line);border-radius:10px;background:white;padding:0 12px}.panel{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #e8ebf0;text-align:left;font-size:13px}th{background:#eef4ff;color:var(--navy)}.badge{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.FAILURE{background:#ffe1e1;color:#a61b1b}.RECOVERY{background:#d9f7ea;color:#087f5b}.STATUS{background:#e8f1ff;color:#174ea6}.ack{border:0;border-radius:8px;padding:8px 11px;background:var(--blue);color:white;font-weight:800;cursor:pointer}.ack:disabled{background:#d7dce5;color:#667085;cursor:default}.error{padding:12px;color:#b42318;font-weight:800}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}table{min-width:1100px}}</style>
<main class="wrap"><header><small>ADMIN QA · AUDIT LEDGER</small><h1>자동 재녹화 감사 원장</h1><p>장애·복구 상태 전환과 관리자 확인 처리를 DB에 보존합니다.</p><div class="metrics" id="metrics"></div></header><div id="error" class="error"></div><section class="filters"><input id="query" placeholder="프로세스·사유 검색"><select id="event"><option value="ALL">전체 상태</option><option>FAILURE</option><option>RECOVERY</option><option>STATUS</option></select><input id="from" type="date"><input id="to" type="date"></section><section class="panel"><table><thead><tr><th>발생일시</th><th>이벤트</th><th>상태</th><th>프로세스</th><th>연속 실패</th><th>처리시간</th><th>사유</th><th>관리자 확인</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
let entries=[],adminApi=false;const el=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=el('query').value.toLowerCase(),ev=el('event').value,from=el('from').value,to=el('to').value;const list=entries.filter(x=>(ev==='ALL'||x.eventType===ev)&&(!q||`${x.processCode} ${x.reason}`.toLowerCase().includes(q))&&(!from||String(x.occurredAt).slice(0,10)>=from)&&(!to||String(x.occurredAt).slice(0,10)<=to));const unack=entries.filter(x=>x.eventType==='FAILURE'&&x.acknowledgementStatus==='UNACKNOWLEDGED').length;el('rows').innerHTML=list.map(x=>`<tr><td>${esc(x.occurredAt)}</td><td><span class="badge ${esc(x.eventType)}">${esc(x.eventType)}</span></td><td>${esc(x.status)}</td><td>${esc(x.processCode||'-')}</td><td>${esc(x.consecutiveFailures)}</td><td>${esc(x.durationMs)}ms</td><td>${esc(x.reason||'-')}</td><td>${x.eventType!=='FAILURE'?'-':x.acknowledgementStatus==='UNACKNOWLEDGED'?(adminApi?`<button class="ack" data-id="${x.id}">확인 처리</button>`:'관리자 로그인 후 처리'):`확인 완료<br><small>${esc(x.acknowledgedBy)} ${esc(x.acknowledgedAt)}</small>`}</td></tr>`).join('')||'<tr><td colspan="8">조건에 맞는 이력이 없습니다.</td></tr>';el('metrics').innerHTML=`<div class="metric"><b>${entries.length}</b><span>전체 이력</span></div><div class="metric"><b>${entries.filter(x=>x.eventType==='FAILURE').length}</b><span>장애</span></div><div class="metric"><b>${entries.filter(x=>x.eventType==='RECOVERY').length}</b><span>복구</span></div><div class="metric ${unack?'alert':''}"><b>${unack}</b><span>미확인 장애</span></div><div class="metric"><b>${list.length}</b><span>조회 결과</span></div>`;document.querySelectorAll('.ack').forEach(b=>b.onclick=()=>acknowledge(b));}
async function load(){el('error').textContent='';const r=await fetch('/api/admin/process-preview-recorder-audit',{cache:'no-store',credentials:'include',redirect:'manual'});const type=r.headers.get('content-type')||'';if(r.ok&&type.includes('application/json')){const d=await r.json();adminApi=true;entries=d.entries||[];render();return}const fallback=await fetch('../process-preview-recorder-audit.json',{cache:'no-store'});if(!fallback.ok)throw Error(`HTTP ${fallback.status}`);const d=await fallback.json();adminApi=false;entries=d.entries||[];el('error').textContent='조회 전용 · 관리자 로그인 후 확인 처리가 활성화됩니다.';render();}
async function acknowledge(button){button.disabled=true;button.textContent='처리 중';try{const r=await fetch(`/api/admin/process-preview-recorder-audit/${button.dataset.id}/acknowledge`,{method:'POST',credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.message||`HTTP ${r.status}`);await load()}catch(e){el('error').textContent=`확인 처리 실패: ${e.message}`;button.disabled=false;button.textContent='확인 처리'}}
['query','event','from','to'].forEach(id=>el(id).addEventListener(id==='query'?'input':'change',render));load().catch(e=>el('error').textContent=`감사 원장 조회 실패: ${e.message}`);
</script><script src="./recorder-status-panel.js"></script></html>
