<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#102a43}header{background:#fff;border-bottom:3px solid #1351b4;padding:22px 42px}main{padding:30px 42px}h1{margin:0 0 8px}.meta{color:#52606d}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:28px}.step{text-align:left;background:#fff;border:2px solid #c8d8ee;border-radius:16px;padding:18px;min-height:330px;color:#102a43}.step b,.step span,.step small{display:block;margin-bottom:13px}.step span{font-weight:700;color:#1351b4}.step small{line-height:1.45;color:#52606d}.step.active{border-color:#1351b4;box-shadow:0 0 0 6px #d8e8ff;transform:translateY(-4px)}footer{margin-top:25px;padding:18px;background:#102a43;color:white;border-radius:12px}</style><header><div>대한민국 정부 공식 서비스</div></header><main><h1>조직경계·다사업장 연결·통합</h1><div class="meta">최신 DB 설계 · 5단계 · KRDS 공통 디자인 · 화면/액터/입력/출력 릴레이</div><section class="flow"><button class="step"><b>1단계 · 법인·사업장·소유구조 수집</b><span>액터 COMPANY_MANAGER</span><span>화면 /emission/organizational-boundary</span><small>입력 tenantId, projectId, reportingEntityId, reportingPeriod, legalEntities, sites, ownershipPercent, effectiveFrom, effectiveUntil, sourceEvidenceIds</small><small>출력 organizationInventoryVersion, entityCount, siteCount, ownershipEvidenceStatus, inventorySnapshotHash</small></button><button class="step"><b>2단계 · 경계 기준·포함 여부 판정</b><span>액터 COMPANY_MANAGER</span><span>화면 /emission/organizational-boundary</span><small>입력 organizationInventoryVersion, consolidationApproach, controlAssessments, inclusionDecisions, exclusionReasons, materialityPolicy</small><small>출력 boundaryDecisionVersion, includedEntityIds, excludedEntityIds, decisionEvidenceIds, decisionSnapshotHash</small></button><button class="step"><b>3단계 · 내부거래 제거·통합 계산</b><span>액터 CALCULATOR</span><span>화면 /emission/organizational-boundary</span><small>입력 boundaryDecisionVersion, internalTransactions, eliminationRules, baseCurrency, conversionRates, consolidationPeriod</small><small>출력 consolidationRunId, eliminationEntries, reconciliationDifference, consolidatedEntityIds, calculationEvidenceIds</small></button><button class="step"><b>4단계 · 경계 승인·버전 확정</b><span>액터 VERIFIER</span><span>화면 /emission/organizational-boundary</span><small>입력 boundaryVersion, boundaryEvidence, consolidationRunId, calculationHash</small><small>출력 boundaryVerificationResult, boundaryFindings</small></button><button class="step"><b>5단계 · 경계 승인·버전 확정</b><span>액터 APPROVER</span><span>화면 /emission/organizational-boundary</span><small>입력 boundaryVersion, boundaryEvidence, consolidationRunId, calculationHash</small><small>출력 boundaryVerificationResult, boundaryFindings</small></button></section><footer id="status">1단계부터 순서대로 현재 설계 연결을 검증합니다.</footer></main><script>const s=[...document.querySelectorAll('.step')];s.forEach((x,i)=>x.onclick=()=>{s.forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelector('#status').textContent=`${i+1}/5 단계 검증 중 · ${x.querySelector('b').textContent}`;});s[0].click()</script></html>
