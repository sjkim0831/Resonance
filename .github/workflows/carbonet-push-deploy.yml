name: Carbonet push deploy

on:
  push:
    branches:
      - main

concurrency:
  group: carbonet-production-deploy
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch production deploy
    runs-on:
      - self-hosted
      - Linux
      - X64
      - resonance-deploy
    timeout-minutes: 45
    steps:
      - name: Deploy and verify
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          started_ms="$(date +%s%3N)"
          marker=/opt/resonance-data/deploy/carbonet-main-success.commit
          if ! sudo -n systemctl start carbonet-auto-deploy.service; then
            sudo -n journalctl -u carbonet-auto-deploy.service -n 120 --no-pager >&2
            exit 1
          fi

          deployed="$(cat "$marker" 2>/dev/null || true)"
          revision_satisfied=false
          if [[ "$deployed" == "$EXPECTED_REVISION" ]]; then
            revision_satisfied=true
          elif [[ -n "$deployed" ]] &&
            git -C /opt/Resonance cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null &&
            git -C /opt/Resonance cat-file -e "$deployed^{commit}" 2>/dev/null &&
            git -C /opt/Resonance merge-base --is-ancestor "$EXPECTED_REVISION" "$deployed"; then
            revision_satisfied=true
            echo "push revision superseded by deployed descendant: $deployed"
          fi
          if [[ "$revision_satisfied" != "true" ]]; then
            echo "deployment marker mismatch expected=$EXPECTED_REVISION actual=${deployed:-missing}" >&2
            exit 1
          fi

          curl -fsS --max-time 10 http://127.0.0.1/actuator/health |
            grep -q '"status":"UP"'
          elapsed_ms=$(( $(date +%s%3N) - started_ms ))
          echo "DEPLOY_EVENT_GATE_PASS revision=$EXPECTED_REVISION elapsedMs=$elapsed_ms"
