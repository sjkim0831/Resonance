name: Carbonet push deploy

on:
  push:
    branches:
      - main

concurrency:
  group: carbonet-production-deploy
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch production deploy
    runs-on:
      - self-hosted
      - Linux
      - X64
      - resonance-deploy
    timeout-minutes: 20
    steps:
      - name: Start fail-closed deployment
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl start --no-block carbonet-auto-deploy.service

      - name: Verify deployed revision and runtime health
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker=/opt/resonance-data/deploy/carbonet-main-success.commit
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            deployed="$(cat "$marker" 2>/dev/null || true)"
            service_state="$(systemctl is-active carbonet-auto-deploy.service || true)"
            if [[ "$deployed" == "$EXPECTED_REVISION" && "$service_state" != "active" ]]; then
              curl -fsS --max-time 10 http://127.0.0.1/actuator/health |
                grep -q '"status":"UP"'
              echo "DEPLOY_EVENT_GATE_PASS revision=$EXPECTED_REVISION"
              exit 0
            fi
            if [[ "$service_state" == "failed" ]]; then
              sudo -n journalctl -u carbonet-auto-deploy.service -n 120 --no-pager >&2
              exit 1
            fi
            sleep 1
          done
          echo "deployment marker did not reach $EXPECTED_REVISION within 900 seconds" >&2
          exit 1
