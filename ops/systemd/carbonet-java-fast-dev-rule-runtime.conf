[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
WorkingDirectory=/opt/resonance-data/dev-worktrees/certificate-verification
Environment=ROOT_DIR=/opt/resonance-data/dev-worktrees/certificate-verification
Environment=CARBONET_CERTIFICATE_VERIFICATION_RULE_FILE=/opt/resonance-data/config/certificate-verification-rules-dev.json
ExecStart=
ExecStart=/bin/bash /opt/resonance-data/dev-worktrees/certificate-verification/ops/scripts/start-java-fast-dev.sh
Restart=on-failure
RestartSec=30
