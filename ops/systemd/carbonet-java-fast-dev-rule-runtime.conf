[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
WorkingDirectory=/opt/resonance-data/dev-worktrees/certificate-verification
Environment=ROOT_DIR=/opt/resonance-data/dev-worktrees/certificate-verification
Environment=GRADLE_USER_HOME=/opt/resonance-data/cache/gradle/java-fast-dev
Environment=CARBONET_CERTIFICATE_VERIFICATION_RULE_FILE=/opt/resonance-data/dev-worktrees/certificate-verification/var/config/certificate-verification-rules-dev.json
Environment=CARBONET_OMNIVERSE_STORAGE_PATH=/opt/resonance-data/dev-worktrees/certificate-verification/var/omniverse-assets
EnvironmentFile=/opt/resonance-data/config/java-fast-dev-runtime-secret.env
ExecStart=
ExecStart=/bin/bash /opt/resonance-data/dev-worktrees/certificate-verification/ops/scripts/start-java-fast-dev.sh
Restart=on-failure
RestartSec=30
