apiVersion: v1
kind: Service
metadata:
  name: p006-runtime
  namespace: carbonet-prod
  labels: { app: p006-runtime, project: p006, framework: resonance }
spec:
  selector: { app: p006-runtime }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p006-runtime
  namespace: carbonet-prod
  labels: { app: p006-runtime, project: p006, framework: resonance }
spec:
  replicas: 2
  minReadySeconds: 10
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: p006-runtime }
  template:
    metadata:
      labels: { app: p006-runtime, project: p006, framework: resonance }
      annotations: { resonance.io/design-source: "projects/P006/design/project.contract.json" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      terminationGracePeriodSeconds: 60
      containers:
        - name: runtime
          image: localhost:5000/carbonet-runtime:2026.08.11-p006-standalone-v1
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: p006-runtime-secret } }]
          env:
            - { name: PROJECT_ID, value: P006 }
            - { name: APP_PROJECT_ID, value: P006 }
            - { name: SERVER_PORT, value: "8080" }
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: CARBONET_OMNIVERSE_STORAGE_PATH, value: /tmp/omniverse-assets }
            - name: TOKEN_ACCESS_SECRET
              valueFrom: { secretKeyRef: { name: carbonet-runtime-secret, key: TOKEN_ACCESS_SECRET } }
            - name: TOKEN_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: carbonet-runtime-secret, key: TOKEN_REFRESH_SECRET } }
          volumeMounts:
            - { name: runtime-manifest, mountPath: /app/config/manifest.json, subPath: manifest.json, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 15, timeoutSeconds: 3, failureThreshold: 3 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 10"] } } }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 3Gi }
      volumes:
        - name: runtime-manifest
          configMap: { name: p006-runtime-manifest }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
