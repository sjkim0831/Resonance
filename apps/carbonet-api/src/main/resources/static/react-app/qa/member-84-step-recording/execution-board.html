<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원 업무 전체 프로세스 실행판</title>
<style>
:root{--p:#246beb;--ink:#0b1f33;--line:#d8e1eb;--bg:#f4f7fb;--ok:#087f5b;--now:#fff2c2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif}main{max-width:1700px;margin:auto;padding:18px}.head,.player,.flow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.head h1{margin:0 0 6px;font-size:26px}.summary{color:#526577}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 11px;border-radius:999px;background:#dff7eb;color:var(--ok);font-weight:800}.layout{display:grid;grid-template-columns:minmax(420px,42%) 1fr;gap:14px;margin-top:14px}.player{position:sticky;top:10px;height:max-content}.player video{width:100%;border-radius:12px;background:#071a35}.current{margin-top:12px;padding:13px;border-left:5px solid var(--p);background:#eef5ff}.current strong{display:block;font-size:18px}.controls{display:flex;gap:8px;margin-top:10px}.controls button{border:1px solid var(--p);border-radius:8px;background:#fff;color:var(--p);padding:9px 12px;font-weight:800;cursor:pointer}.controls .primary{background:var(--p);color:#fff}.scenario{border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}.scenario h2{margin:0;padding:11px 13px;background:#eef5ff;font-size:17px}.process{padding:10px 12px;border-top:1px solid var(--line)}.process h3{margin:0 0 8px;font-size:14px;color:#155db1}.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:7px}.step{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px;text-align:left;cursor:pointer;min-height:88px}.step:hover{border-color:var(--p)}.step.active{background:var(--now);border:3px solid #e67700}.step.done{border-color:#20a876}.num{font-weight:900;color:var(--p)}.name{display:block;margin:4px 0;font-weight:800}.meta{font-size:11px;color:#60758a}.legend{font-size:13px;color:#526577;margin-bottom:10px}@media(max-width:950px){.layout{grid-template-columns:1fr}.player{position:static}}
</style></head><body><main>
<section class="head"><h1>회원 업무 전체 프로세스 실행판</h1><p class="summary">전체 순서도를 한눈에 보고, 업무 상자를 눌러 해당 실행 장면과 실제 화면을 확인합니다.</p><div class="stats"><span class="stat">최신 DB 설계</span><span class="stat">21개 프로세스</span><span class="stat">81개 단계</span><span class="stat">81/81 설계 연결</span></div></section>
<div class="layout"><section class="player"><video id="video" controls preload="metadata" src="member-84-step-live-walkthrough.mp4"></video><div class="current"><span id="counter">현재 업무</span><strong id="title">순서도를 불러오는 중</strong><span id="detail"></span></div><div class="controls"><button id="prev">이전 업무</button><button class="primary" id="play">현재부터 재생</button><button id="next">다음 업무</button><button id="open">실제 화면 열기</button></div></section>
<section class="flow"><div class="legend">초록색=재생 완료 · 노란색=현재 업무 · 상자 선택=해당 실행 시점 이동</div><div id="board"></div></section></div>
<script>
const video=document.querySelector('#video'),board=document.querySelector('#board');let steps=[],active=0,duration=165.16,sourceDuration=200.333333;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seek(i,autoplay=false){active=Math.max(0,Math.min(steps.length-1,i));const s=steps[active];video.currentTime=Math.max(0,(s.timeSeconds/sourceDuration)*duration);renderState();document.querySelector(`[data-i="${active}"]`)?.scrollIntoView({block:'center',behavior:'smooth'});if(autoplay)video.play();}
function renderState(){const s=steps[active];document.querySelector('#counter').textContent=`${active+1}/${steps.length} · ${s.scenarioLabel}`;document.querySelector('#title').textContent=s.stepName;document.querySelector('#detail').textContent=`${s.processCode} · ${s.actorCode} · ${s.fromState} → ${s.toState}`;document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===active);el.classList.toggle('done',i<active)});}
function render(){const scenarios=[...new Set(steps.map(s=>s.scenarioId))];board.innerHTML=scenarios.map(sid=>{const ss=steps.filter(s=>s.scenarioId===sid),procs=[...new Set(ss.map(s=>s.processCode))];return `<article class="scenario"><h2>${esc(sid)} · ${esc(ss[0].scenarioLabel)}</h2>${procs.map(p=>`<section class="process"><h3>${esc(p)}</h3><div class="steps">${ss.filter(s=>s.processCode===p).map(s=>{const i=steps.indexOf(s);return `<button class="step" data-i="${i}"><span class="num">${i+1}</span><span class="name">${esc(s.stepName)}</span><span class="meta">${esc(s.actorCode)} · ${esc(s.fromState)} → ${esc(s.toState)}</span></button>`}).join('')}</div></section>`).join('')}</article>`}).join('');document.querySelectorAll('.step').forEach(el=>el.onclick=()=>seek(+el.dataset.i));const requested=new URLSearchParams(location.search).get('process');const requestedIndex=requested?steps.findIndex(s=>s.processCode===requested):-1;if(requestedIndex>=0)active=requestedIndex;renderState();if(requestedIndex>=0)setTimeout(()=>document.querySelector(`[data-i="${active}"]`)?.scrollIntoView({block:'center'}),100)}
Promise.all([fetch('../member-eight-scenario/timeline.json').then(r=>r.json()),fetch('live-manifest.json').then(r=>r.json())]).then(([t,m])=>{steps=t.steps;duration=m.durationSeconds;sourceDuration=t.videoDurationSeconds||sourceDuration;render()});
video.addEventListener('timeupdate',()=>{if(!steps.length)return;const sourceTime=(video.currentTime/duration)*sourceDuration;let i=steps.findLastIndex(s=>s.timeSeconds<=sourceTime);if(i>=0&&i!==active){active=i;renderState()}});document.querySelector('#prev').onclick=()=>seek(active-1);document.querySelector('#next').onclick=()=>seek(active+1);document.querySelector('#play').onclick=()=>seek(active,true);document.querySelector('#open').onclick=()=>{const s=steps[active];window.open(`${s.routePath}${s.routePath.includes('?')?'&':'?'}testMode=1&guide=1&processCode=${encodeURIComponent(s.processCode)}&stepCode=${encodeURIComponent(s.stepCode)}`,'_blank')};
</script></main></body></html>
