apiVersion: v1
kind: ConfigMap
metadata:
  name: resonance-backstage-config
  namespace: resonance-ops
  labels:
    app.kubernetes.io/name: resonance-backstage
    app.kubernetes.io/part-of: resonance-control-plane
data:
  BACKSTAGE_BASE_URL: https://backstage.172.16.1.232.nip.io:32947
  CARBONET_RUNTIME_BASE_URL: http://carbonet-api.carbonet-prod.svc.cluster.local:8080
  POSTGRES_HOST: postgres-haproxy.carbonet-prod.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: backstage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resonance-backstage
  namespace: resonance-ops
  annotations:
    resonance.io/visual-e2e-contract: impact-gate-plus-nightly-full
  labels:
    app.kubernetes.io/name: resonance-backstage
    app.kubernetes.io/part-of: resonance-control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resonance-backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resonance-backstage
        app.kubernetes.io/part-of: resonance-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ceu
            - |
              until nc -z -w 2 "${POSTGRES_HOST}" "${POSTGRES_PORT}"; do
                echo "[backstage] waiting for PostgreSQL endpoint ${POSTGRES_HOST}:${POSTGRES_PORT}"
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: resonance-backstage-config
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backstage
          image: localhost:5000/resonance-backstage:bootstrap
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - configMapRef:
                name: resonance-backstage-config
            - secretRef:
                name: resonance-backstage-database
            - secretRef:
                name: resonance-backstage-auth
                optional: true
            - secretRef:
                name: resonance-ops-bridge
            - secretRef:
                name: resonance-runtime-purge-recovery
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /app/internal-ca/ca.crt
          volumeMounts:
            - name: resonance-catalog
              mountPath: /app/catalog
              readOnly: true
            - name: resonance-internal-ca
              mountPath: /app/internal-ca
              readOnly: true
            - name: resonance-deploy-status
              mountPath: /app/deploy-status
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/resonance-projects/health/project-runtime-purge-recovery
              port: http
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: catalog-server
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8081", "-h", "/catalog"]
          ports:
            - name: catalog
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /components.yaml
              port: catalog
            initialDelaySeconds: 0
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: resonance-catalog
              mountPath: /catalog
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: resonance-catalog
          configMap:
            name: resonance-backstage-catalog
        - name: resonance-internal-ca
          configMap:
            name: resonance-internal-ca
            optional: true
        - name: resonance-deploy-status
          hostPath:
            path: /opt/resonance-data/deploy
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: resonance-backstage
  namespace: resonance-ops
  labels:
    app.kubernetes.io/name: resonance-backstage
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: resonance-backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
      nodePort: 30707
---
apiVersion: v1
kind: Service
metadata:
  name: resonance-backstage-catalog
  namespace: resonance-ops
  labels:
    app.kubernetes.io/name: resonance-backstage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resonance-backstage
  ports:
    - name: catalog
      port: 8081
      targetPort: catalog
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resonance-backstage-ingress
  namespace: resonance-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resonance-backstage
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.16.0.0/16
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 7007
