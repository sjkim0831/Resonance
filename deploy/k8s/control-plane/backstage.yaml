apiVersion: v1
kind: ConfigMap
metadata:
  name: resonance-backstage-config
  namespace: resonance-ops
  labels:
    app.kubernetes.io/name: resonance-backstage
    app.kubernetes.io/part-of: resonance-control-plane
data:
  BACKSTAGE_BASE_URL: http://172.16.1.232:30707
  POSTGRES_HOST: postgres-haproxy.carbonet-prod.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: backstage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resonance-backstage
  namespace: resonance-ops
  labels:
    app.kubernetes.io/name: resonance-backstage
    app.kubernetes.io/part-of: resonance-control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resonance-backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resonance-backstage
        app.kubernetes.io/part-of: resonance-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: localhost:5000/resonance-backstage:bootstrap
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - configMapRef:
                name: resonance-backstage-config
            - secretRef:
                name: resonance-backstage-database
          volumeMounts:
            - name: resonance-catalog
              mountPath: /app/catalog
              readOnly: true
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: resonance-catalog
          configMap:
            name: resonance-backstage-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: resonance-backstage
  namespace: resonance-ops
  labels:
    app.kubernetes.io/name: resonance-backstage
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: resonance-backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
      nodePort: 30707
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resonance-backstage-ingress
  namespace: resonance-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: resonance-backstage
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.16.0.0/16
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 7007
