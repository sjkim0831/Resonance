apiVersion: v1
kind: Namespace
metadata:
  name: resonance-design
  labels:
    resonance.io/environment: design
    resonance.io/data-classification: internal
---
apiVersion: v1
kind: Namespace
metadata:
  name: carbonet-dev
  labels:
    resonance.io/environment: development
    resonance.io/data-classification: synthetic-only
---
apiVersion: v1
kind: Namespace
metadata:
  name: carbonet-staging
  labels:
    resonance.io/environment: staging
    resonance.io/data-classification: masked
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: carbonet-dev
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: development-budget
  namespace: carbonet-dev
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: resonance-design
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: carbonet-dev
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: carbonet-staging
spec:
  podSelector: {}
  policyTypes: [Ingress]
