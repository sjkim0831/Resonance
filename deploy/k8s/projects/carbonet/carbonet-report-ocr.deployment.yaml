apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonet-report-ocr
  namespace: carbonet-prod
  labels:
    app: carbonet-report-ocr
    framework: resonance
    project: carbonet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbonet-report-ocr
  template:
    metadata:
      labels:
        app: carbonet-report-ocr
        framework: resonance
        project: carbonet
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report-ocr
          image: localhost:5000/carbonet-report-ocr:3.1.0-r3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: HOME
              value: /home/reportocr
          resources:
            limits:
              cpu: "4"
              memory: "4Gi"
            requests:
              cpu: "250m"
              memory: "1Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: carbonet-report-ocr
  namespace: carbonet-prod
spec:
  type: ClusterIP
  selector:
    app: carbonet-report-ocr
  ports:
    - name: http
      port: 8091
      targetPort: http
